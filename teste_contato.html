<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Contato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #25d366;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #128c7e;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🧪 Teste de Captura de Contatos</h1>
    <p>Este formulário testa se o sistema está capturando os contatos corretamente.</p>
    
    <form id="testeForm">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
        </div>
        
        <div class="form-group">
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
        </div>
        
        <button type="submit">Enviar Teste</button>
    </form>
    
    <div id="resultado" class="result"></div>
    
    <script>
        document.getElementById('testeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('nome', document.getElementById('nome').value);
            formData.append('telefone', document.getElementById('telefone').value);
            formData.append('mensagem', document.getElementById('mensagem').value);
            
            const resultado = document.getElementById('resultado');
            
            fetch('processar_contato.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                resultado.style.display = 'block';
                resultado.className = 'result success';
                resultado.innerHTML = `
                    <h3>✅ Sucesso!</h3>
                    <p>Contato salvo com sucesso!</p>
                    <p><strong>Resposta do servidor:</strong></p>
                    <pre>${data}</pre>
                `;
            })
            .catch(error => {
                resultado.style.display = 'block';
                resultado.className = 'result error';
                resultado.innerHTML = `
                    <h3>❌ Erro!</h3>
                    <p>Erro ao salvar contato:</p>
                    <pre>${error.message}</pre>
                `;
            });
        });
    </script>
</body>
</html>
